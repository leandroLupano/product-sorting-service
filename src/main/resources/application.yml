## Server settings:
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

## App settings:
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
    git:
      enabled: false
info:
  app:
    name: "product-sorting-service"
    version: "0.0.1"
    description: "REST API for sorting products based on configurable criteria like sales units and stock availability."
    java:
      version: "21.0.5"
    spring-boot:
      version: "3.4.5"

##SpringDoc OpenApi:
custom:
  openapi:
    title: "Product Sorting API"
    version: "1.0"
    description: "REST API for sorting products based on configurable criteria like sales units and stock availability."
    contact:
      name: "Leandro Lupano"
      url: "https://github.com/leandroLupano/product-sorting-service"

spring:
  application:
    name: product-sorting-service
  output:
    ansi:
      enabled: always
## Database settings (H2):
  datasource:
    url: jdbc:h2:mem:productsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
## Database settings (PostgreSQL):
#  datasource:
#    url: jdbc:postgresql://localhost:5432/products
#    driver-class-name: org.postgresql.Driver
#    username: postgres
#    password: your_password
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
## Database settings (PostgreSQL):
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

# Logging settings:
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE